[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dstui"
version = "0.1.0"
description = "Simple Textual TUI for chatting with a DeepSeek Harness agent"
readme = "README.md"
# Supported-version floor (package metadata). The exact build / dev / CI
# interpreter is pinned once in .python-version; keep the minor in sync.
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kresimir Sparavec", email = "ksparavec@devitops.com" },
]
maintainers = [
    { name = "Kresimir Sparavec", email = "ksparavec@devitops.com" },
]
keywords = ["deepseek", "deepseek-harness", "agent", "llm", "chat", "tui", "textual", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    # The official SDK, pure Python. Its dependency deepseek-harness-runtime-bin (a 275 MB
    # Node single executable + ripgrep sidecar + a `dsh` script) is deliberately NOT shipped:
    # the installer installs the SDK with --no-deps, and dstui runs the separately installed
    # DeepSeek Harness `dsh` (npm @deepseek-ai/dsh). See dstui.config.resolve_dsh_bin.
    "deepseek-harness-sdk==0.1.5rc1",
    # The SDK's only other dependency, declared explicitly because of that --no-deps.
    "pydantic>=2.12,<3",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/ksparavec/dstui"
Repository = "https://github.com/ksparavec/dstui"
Issues = "https://github.com/ksparavec/dstui/issues"
Changelog = "https://github.com/ksparavec/dstui/blob/main/CHANGELOG.md"

[project.scripts]
dstui = "dstui:main"

[project.optional-dependencies]
dev = [
    # Test-only embedded DeepSeek Harness runtime: the e2e tests drive it because no
    # separately installed `dsh` exists on the dev and CI hosts. NEVER shipped: `make lock`
    # leaves it out of requirements.txt, and `make package` fails if it (or anything Node)
    # reaches the bundle.
    "deepseek-harness-runtime-bin==0.1.5rc1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "mypy",
    "bandit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dstui"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dstui",
    "tools",
    "tests",
    "Makefile",
    "install.sh",
    ".python-version",
    "requirements.txt",
    "requirements-dev.txt",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

# `make dev-install` builds .venv with uv pip from the [dev] extra; requirements*.txt are the
# locks. Not a uv-managed project, so `uv run` runs in that .venv as it is, instead of writing
# a uv.lock and syncing the environment away from the [dev] extra.
[tool.uv]
managed = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: drives the real DeepSeek Harness runtime against a fake local DeepSeek API",
]

[tool.coverage.run]
source = ["dstui"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
# python_version intentionally unset — mypy follows the running interpreter
# (the .venv, pinned via .python-version).
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["dstui"]
mypy_path = "src"

# The SDK is fully annotated but ships no py.typed marker: check against its real types
# instead of treating it as Any.
[[tool.mypy.overrides]]
module = ["deepseek_harness", "deepseek_harness.*"]
follow_untyped_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
